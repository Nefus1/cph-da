      row_item.description + (' x' + row_item.last4 if row_item.last4 else '')
  - Value: |
      currency(row_item.value)
  - Character: |
      row_item.character_label()
  - To: |
      party_ref[row_item.allocation()]
edit:
  - description
delete buttons: True
