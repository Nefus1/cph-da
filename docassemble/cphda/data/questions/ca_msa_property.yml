id: reimbursement waivers
section: rev_property
question: Reimbursement claims
subquestion: |
  After separation, parties often pay community bills with their own
  money or have exclusive use of community property. Most MSAs
  resolve these claims with a mutual waiver as part of the overall
  deal. Check each claim the parties are **waiving**.
fields:
  - The parties mutually waive: reimbursement_waivers
    datatype: checkboxes
    choices:
      - "{Epstein credits} (post-separation payments of community debts)": epstein
      - "{Watts charges} (exclusive use of community property after separation)": watts
      - "{Section 2640 reimbursement} (separate-property contributions to community property)": s2640
      - Other reimbursement claims, including for separate funds used for the community and community funds used for a party's separate property: other
    none of the above: Waive none of these
  - Claims that are NOT waived and how they are resolved: reimbursement_exceptions
    input type: area
    required: False
    hint: e.g., Respondent receives a $12,000 Section 2640 reimbursement, added to the equalizing payment.
help: |
  A waiver of Section 2640 reimbursement must be in writing
  (Fam. Code, § 2640(b)). Any reimbursement that is *not* waived
  should be quantified and included in the equalizing payment.
---
id: property summary
section: rev_property
question: Property and debt summary
subquestion: |
  Click **Edit** to change an item, or add one. Values are net of
  loans; only community interests count toward the equal division.

  % for grp_label, grp_list in (('Real estate', real_property), ('Vehicles', vehicles), ('Financial accounts', accounts), ('Retirement plans', retirement_plans), ('Business interests', businesses), ('Other assets', other_assets), ('Debts', debts)):
  % if len(grp_list):
  <h3 class="h6 mt-3">${ grp_label }</h3>

  ${ grp_list.table }

  % endif
  % endfor

  <div class="btn-group flex-wrap mb-3">
  ${ real_property.add_action(label='Add real estate') }
  ${ vehicles.add_action(label='Add vehicle') }
  ${ accounts.add_action(label='Add account') }
  ${ retirement_plans.add_action(label='Add retirement plan') }
  ${ businesses.add_action(label='Add business') }
  ${ other_assets.add_action(label='Add other asset') }
  ${ debts.add_action(label='Add debt') }
  </div>

  <h3 class="h5">Equal division (Fam. Code, § 2550)</h3>

  <table class="table table-sm cph-money">
  <tr><th></th><th class="amt">${ petitioner.ref }</th><th class="amt">${ respondent.ref }</th></tr>
  <tr><td>Community assets received</td><td class="amt">${ currency(eq['pet_assets']) }</td><td class="amt">${ currency(eq['resp_assets']) }</td></tr>
  <tr><td>Community debts assumed</td><td class="amt">(${ currency(eq['pet_debts']) })</td><td class="amt">(${ currency(eq['resp_debts']) })</td></tr>
  <tr class="total"><td>Net community received</td><td class="amt">${ currency(eq['pet_net']) }</td><td class="amt">${ currency(eq['resp_net']) }</td></tr>
  </table>

  % if eq['payor']:
  <div class="cph-callout">
  To equalize, **${ party_obj[eq['payor']].ref } owes
  ${ party_obj[eq['payee']].ref } ${ currency(eq['payment']) }**.
  Items divided equally in kind (${ currency(eq['split_assets'] - eq['split_debts']) }
  net) do not affect the payment.
  </div>
  % else:
  <div class="cph-tip">The division is already equal. No equalizing payment is needed.</div>
  % endif
continue button field: property_summary_reviewed
help: |
  **Equalizing payment.** Each party must receive one-half of the
  net community estate unless the parties agree otherwise in writing
  (Fam. Code, § 2550). The payment is half the difference between
  the net community each party receives.

  **Separate property** is confirmed to its owner and does not count.
  For mixed items, only the community portion counts.
---
id: real property table
table: real_property.table
rows: real_property
columns:
  - Property: |
      row_item.description.splitlines()[0]
  - Equity: |
      currency(row_item.net_value())
  - Character: |
      row_item.character_label()
  - To: |
      'Sell' if not row_item.is_separate() and row_item.disposition == 'sell' else party_ref[row_item.allocation()]
edit:
  - description
delete buttons: True
---
