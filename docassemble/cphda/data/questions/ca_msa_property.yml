#######################################################################
# Other assets
#######################################################################
id: any other assets
section: rev_property
question: Are there any other significant assets?
subquestion: |
  Jewelry, art, collectibles, firearms, tax refunds, stock options,
  RSUs, timeshares, intellectual property, pets, and claims against
  third parties. Ordinary household furniture is handled on a later
  screen.
yesno: other_assets.there_are_any
help: |
  **Pets.** The court may assign sole or joint ownership of a pet
  animal, taking into account the care of the animal (Fam. Code,
  § 2605).

  **Stock options and RSUs.** Unvested grants are often apportioned
  with a time rule (In re Marriage of Hug (1984) 154 Cal.App.3d 780;
  In re Marriage of Nelson (1986) 177 Cal.App.3d 150). Describe the
  formula in the description.
---
