---
id: vehicle complete
code: |
  vehicles[i].description
  vehicles[i].complete = True
---
id: another vehicle
section: rev_property
question: Is there another vehicle?
subquestion: |
  So far: ${ comma_and_list([v.description for v in vehicles.complete_elements()]) }.
yesno: vehicles.there_is_another
---
#######################################################################
# Financial accounts
#######################################################################
id: any accounts
section: rev_property
question: Do either or both parties have bank, brokerage, or other financial accounts?
subquestion: |
  Checking, savings, money market, CDs, brokerage, HSA, 529 plans,
  cryptocurrency, and cash value life insurance. Retirement accounts
  come next.
yesno: accounts.there_are_any
---
id: account item
section: rev_property
question: |
  Financial account ${ '#' + str(i + 1) if i else '' }
fields:
  - Institution: accounts[i].description
    hint: Chase, Fidelity, Coinbase
    grid: 6
  - Type of account: accounts[i].account_type
    input type: dropdown
    choices:
      - Checking: checking
      - Savings or money market: savings
      - Certificate of deposit: cd
      - Brokerage or investment: brokerage
      - Health savings account (HSA): hsa
      - 529 education plan: education
      - Cryptocurrency: crypto
      - Cash value life insurance: life
      - Other: other
    grid: 6
  - Last 4 digits: accounts[i].last4
    required: False
    maxlength: 4
    grid: 4
  - Balance or value: accounts[i].value
    datatype: currency
    grid: 4
  - As of: accounts[i].value_date
    datatype: date
    required: False
    grid: 4
  - Character: accounts[i].character
    input type: radio
    choices:
      - Community property: community
      - Mixed (part community, part separate): mixed
      - ${ petitioner }'s separate property: sp_pet
      - ${ respondent }'s separate property: sp_resp
    default: community
  - Net community interest: accounts[i].community_portion
    datatype: currency
    show if:
      variable: accounts[i].character
      is: mixed
  - Awarded to: accounts[i].awarded_to
    input type: radio
    choices:
      - ${ petitioner }: pet
      - ${ respondent }: resp
      - Divided equally in kind: split
    js show if: |
      val("accounts[i].character") == "community" || val("accounts[i].character") == "mixed"
help: |
  **Valuation date.** Balances change. Agree on a valuation date
  (usually close to signing) and say whether post-separation
  deposits and withdrawals are adjusted. Earnings on a party's
  post-separation deposits are that party's separate property.

  **529 plans.** These belong to the account owner, not the child.
  Consider naming a successor owner or agreeing the funds will be
  used only for the child's education.
---
id: account complete
code: |
  accounts[i].description
  accounts[i].complete = True
---
id: another account
section: rev_property
question: Is there another financial account?
subquestion: |
  So far: ${ comma_and_list([a.description for a in accounts.complete_elements()]) }.
yesno: accounts.there_is_another
---
#######################################################################
# Retirement
#######################################################################
id: any retirement
section: rev_property
question: Do either or both parties have retirement plans or pensions?
subquestion: |
  401(k), 403(b), 457, IRA, Roth IRA, pension (defined benefit),
  CalPERS, CalSTRS, LACERA, federal (FERS/TSP), and military
  retirement. Include plans that are separate property.
yesno: retirement_plans.there_are_any
help: |
  Pension rights earned during the ${ marriage_word } are community
  property even if not vested ({In re Marriage of Brown}). The
  standard approach divides the community interest by {QDRO} using
  the time rule, so no present value is needed for a pension.
---
id: retirement item
section: rev_property
question: |
  Retirement plan ${ '#' + str(i + 1) if i else '' }
fields:
  - Plan name: retirement_plans[i].description
    hint: Acme Corp. 401(k) Savings Plan
  - Plan type: retirement_plans[i].plan_type
    input type: dropdown
    choices:
      - 401(k), 403(b), or 457 (defined contribution): dc
      - Traditional, SEP, or SIMPLE IRA: ira
      - Roth IRA: roth_ira
      - Private pension (defined benefit): db
      - CalPERS: calpers
      - CalSTRS: calstrs
      - County retirement system (e.g., LACERA): county
      - Federal (FERS, CSRS, or TSP): federal
      - Military retirement: military
      - Other: other
  - Participant: retirement_plans[i].participant
    input type: radio
    choices:
      - ${ petitioner }: pet
      - ${ respondent }: resp
  - Character: retirement_plans[i].character
    input type: radio
    choices:
      - Entirely community: community
      - Mixed (contributions or service before marriage or after separation): mixed
      - ${ petitioner }'s separate property: sp_pet
      - ${ respondent }'s separate property: sp_resp
    default: mixed
  - Balance or estimated value: retirement_plans[i].value
    datatype: currency
    min: 0
    required: False
    help: |
      Optional for pensions divided by QDRO. Needed if the plan is
      awarded entirely to one party, so the equalization is accurate.
  - Net community interest: retirement_plans[i].community_portion
    datatype: currency
    min: 0
    required: False
    show if:
      variable: retirement_plans[i].character
      is: mixed
    help: |
      Needed only if the plan is awarded entirely to one party.
      For a QDRO division, the plan administrator applies the time
      rule or a tracing.
  - How is the community interest divided?: retirement_plans[i].division
    input type: radio
    choices:
      - Divided equally by QDRO / domestic relations order (or IRA transfer): qdro
      - Awarded entirely to ${ petitioner }: pet
      - Awarded entirely to ${ respondent }: resp
    js show if: |
      val("retirement_plans[i].character") == "community" || val("retirement_plans[i].character") == "mixed"
help: |
  **QDRO vs. buyout.** A QDRO splits the community share at the plan
  level, with no tax at transfer. Awarding the whole plan to the
  participant requires a present value, and pre-tax money should be
  discounted for taxes when traded against after-tax assets.

  **IRAs** are divided by a transfer incident to divorce
  (26 U.S.C. § 408(d)(6)); no QDRO is needed.

  **Public plans.** CalPERS, CalSTRS, county systems, federal plans,
  and military retirement each have their own order format. Military
  retirement under the USFSPA requires the 10-year/10-year rule for
  direct DFAS payments and an election of Survivor Benefit Plan
  coverage within one year.
---
id: retirement order terms
section: rev_property
question: |
  Order terms for ${ retirement_plans[i].description }
if: retirement_plans[i].division == 'qdro' and retirement_plans[i].needs_order()
fields:
  - Who prepares the order?: retirement_plans[i].order_preparer
    input type: radio
    choices:
      - A QDRO specialist jointly retained by the parties: specialist
      - Counsel for ${ petitioner }: pet
      - Counsel for ${ respondent }: resp
    default: specialist
  - Who pays for the order?: retirement_plans[i].order_cost
    input type: radio
    choices:
      - Shared equally: equal
      - The participant: participant
      - The non-participant: nonparticipant
    default: equal
  - Award survivor benefits to the non-participant for the community share?: retirement_plans[i].survivor_benefit
    datatype: yesnoradio
    default: True
    show if:
      code: retirement_plans[i].offers_survivor()
    help: |
      Without survivor benefits, the non-participant's share of a
      pension ends at the participant's death. The court may order
      the participant to elect survivor coverage (Fam. Code, § 2610).
---
id: retirement complete
code: |
  retirement_plans[i].description
  if not retirement_plans[i].is_separate() and retirement_plans[i].division == 'qdro' and retirement_plans[i].needs_order():
    retirement_plans[i].order_preparer
  if not retirement_plans[i].is_separate() and retirement_plans[i].division != 'qdro' and not retirement_plans[i].value:
    retirement_plans[i].value_confirmed
  retirement_plans[i].complete = True
---
id: retirement value warning
section: rev_property
question: No value entered
subquestion: |
  ${ retirement_plans[i].description } is awarded entirely to one
  party, but no value was entered, so it will count as $0 in the
  equalization. Go back to enter a value, or continue if the parties
  agree it has no value.
continue button field: retirement_plans[i].value_confirmed
---
id: another retirement
section: rev_property
question: Is there another retirement plan?
subquestion: |
  So far: ${ comma_and_list([r.description for r in retirement_plans.complete_elements()]) }.
yesno: retirement_plans.there_is_another
---
#######################################################################
# Businesses
#######################################################################
id: any businesses
section: rev_property
question: Do either or both parties own an interest in a business?
subquestion: |
  Sole proprietorships, partnerships, LLCs, corporations, and
  professional practices.
yesno: businesses.there_are_any
help: |
  Business valuation is often the most contested issue in a
  division. Goodwill of a professional practice is community
  property to the extent developed during the ${ marriage_word }.
  If the business existed before marriage, the community interest
  is usually apportioned by *Pereira* or *Van Camp* (Pereira v.
  Pereira (1909) 156 Cal. 1; Van Camp v. Van Camp (1921) 53
  Cal.App. 17).
---
id: business item
section: rev_property
question: |
  Business interest ${ '#' + str(i + 1) if i else '' }
fields:
  - Business name: businesses[i].description
  - Entity type: businesses[i].entity_type
    input type: dropdown
    choices:
      - Sole proprietorship: sole
      - Partnership: partnership
      - Limited liability company: llc
      - Corporation: corporation
      - Professional corporation: pc
    grid: 6
  - Ownership percentage held by the parties: businesses[i].ownership_pct
    datatype: number
    min: 0
    max: 100
    default: 100
    grid: 6
  - Value of the parties' interest: businesses[i].value
    datatype: currency
    min: 0
  - Character: businesses[i].character
    input type: radio
    choices:
      - Community property: community
      - Mixed (part community, part separate): mixed
      - ${ petitioner }'s separate property: sp_pet
      - ${ respondent }'s separate property: sp_resp
    default: community
  - Net community interest: businesses[i].community_portion
    datatype: currency
    show if:
      variable: businesses[i].character
      is: mixed
  - Awarded to: businesses[i].awarded_to
    input type: radio
    choices:
      - ${ petitioner }: pet
      - ${ respondent }: resp
    js show if: |
      val("businesses[i].character") == "community" || val("businesses[i].character") == "mixed"
---
id: business complete
code: |
  businesses[i].description
  businesses[i].complete = True
---
id: another business
section: rev_property
question: Is there another business interest?
yesno: businesses.there_is_another
