section: rev_property
question: |
  Debt ${ '#' + str(i + 1) if i else '' }
fields:
  - Creditor: debts[i].description
    grid: 6
  - Type: debts[i].debt_type
    input type: dropdown
    choices:
      - Credit card: credit_card
      - Personal or signature loan: personal
      - Student loan: student
      - Medical: medical
      - Tax: tax
      - Vehicle lease: lease
      - Loan from family or friend: family
      - Other: other
    grid: 6
  - Last 4 digits: debts[i].last4
    required: False
    maxlength: 4
    grid: 4
  - Balance: debts[i].value
    datatype: currency
    min: 0
    grid: 8
  - Character: debts[i].character
    input type: radio
    choices:
      - Community debt: community
      - ${ petitioner }'s separate debt: sp_pet
      - ${ respondent }'s separate debt: sp_resp
    default: community
  - Assigned to: debts[i].assigned_to
    input type: radio
    choices:
      - ${ petitioner }: pet
      - ${ respondent }: resp
      - Paid equally by both: split
    show if:
      variable: debts[i].character
      is: community
---
