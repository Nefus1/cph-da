  - Loan balance: vehicles[i].encumbrance
    datatype: currency
    min: 0
    grid: 4
  - Character: vehicles[i].character
    input type: radio
    choices:
      - Community property: community
      - Mixed (part community, part separate): mixed
      - ${ petitioner }'s separate property: sp_pet
