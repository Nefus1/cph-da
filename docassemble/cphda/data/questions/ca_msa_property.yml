delete buttons: True
---
id: equalization approach
section: rev_property
question: Equalizing payment
subquestion: |
  Based on the values entered, ${ party_obj[eq['payor']].ref } would
  owe ${ party_obj[eq['payee']].ref } an {equalizing payment} of
  **${ currency(eq['payment']) }**.
fields:
  - The parties agree to: eq_approach
    input type: radio
    choices:
      - Pay the calculated amount (${ currency(eq['payment']) }): pay
      - Pay a different negotiated amount: custom
      - Waive the equalizing payment (knowingly accept an unequal division): waive
  - Agreed amount: eq_custom_amount
    datatype: currency
    min: 0
    show if:
      variable: eq_approach
      is: custom
  - Paid by: eq_custom_payor
    input type: radio
    choices:
      - ${ petitioner }: pet
      - ${ respondent }: resp
    default: ${ eq['payor'] }
    show if:
      variable: eq_approach
      is: custom
  - Why are the parties agreeing to a different amount?: eq_custom_reason
    input type: area
    required: False
    js show if: |
      val("eq_approach") == "custom" || val("eq_approach") == "waive"
    hint: e.g., in exchange for Respondent's waiver of spousal support
help: |
  Parties may agree to an unequal division in writing (Fam. Code,
  § 2550). State the reason: a recited trade-off (for example, a
  larger property share in exchange for a support waiver) makes the
  agreement harder to attack later as unconscionable or as the
  product of undue influence.
---
id: equalization final values
reconsider: True
code: |
  if eq.get('payment', 0) <= 0 or eq_approach == 'waive':
    eq_amount = 0
    eq_payor = None
  elif eq_approach == 'custom':
    eq_amount = eq_custom_amount
    eq_payor = eq_custom_payor
  else:
    eq_amount = eq['payment']
    eq_payor = eq['payor']
  eq_payee = {'pet': 'resp', 'resp': 'pet'}.get(eq_payor)
  if eq.get('payment', 0) <= 0:
    eq_mode = 'equal'
  else:
    eq_mode = eq_approach
---
id: equalization payment terms
section: rev_property
question: How will the equalizing payment be made?
fields:
  - Payment method: eq_payment_method
    input type: radio
    choices:
      - Lump sum: lump
      - From the sale or refinance proceeds of the real property: proceeds
      - Installments: installments
  - Due within (days after the agreement is signed): eq_due_days
    datatype: integer
    min: 1
    default: 30
    show if:
      variable: eq_payment_method
      is: lump
  - Installment terms: eq_installments
    input type: area
    show if:
      variable: eq_payment_method
      is: installments
    hint: e.g., $1,000 per month starting January 1, 2027, with 5% simple interest, secured by a deed of trust on the residence.
  - Interest on late payment: eq_interest
    datatype: yesnoradio
    default: True
    help: |
      Unpaid amounts accrue interest at the legal rate on judgments
      (10% per year, Code Civ. Proc., § 685.010) once the agreement
      is merged into a judgment.
help: |
  If the payment is deferred, secure it: a deed of trust on real
  property, a lien on a retirement account by QDRO, or a
  non-dischargeable note. Note that an equalizing payment owed to a
  former spouse is not dischargeable in a chapter 7 bankruptcy
  (11 U.S.C. § 523(a)(15)).
---
id: rev property
event: rev_property
section: rev_property
question: Review property and debts
review:
  - Edit: property_summary_reviewed
    button: |
      **Assets and debts:** ${ len(real_property) + len(vehicles) + len(accounts) + len(retirement_plans) + len(businesses) + len(other_assets) } assets, ${ len(debts) } debts
  - Edit: household_goods
    button: |
      **Household goods:** ${ 'each keeps what they have' if household_goods == 'possession' else 'per list' }
  - Edit: reimbursement_waivers
    button: |
      **Reimbursement waivers:** ${ comma_and_list(reimbursement_waivers.true_values()) or 'none' }
  - Edit: eq_approach
    button: |
      **Equalization:** ${ currency(eq_amount) } ${ 'from ' + party_obj[eq_payor].ref if eq_payor else '' }
  - Edit: eq_payment_method
    button: |
      **Payment method:** ${ eq_payment_method }
