---
id: household goods
section: rev_property
question: Household furniture, furnishings, and personal effects
fields:
  - How are these divided?: household_goods
    input type: radio
    choices:
      - Each party keeps what is in their possession: possession
      - Divided according to a list: list
    default: possession
  - List: household_goods_list
    input type: area
    show if:
      variable: household_goods
      is: list
    hint: |
      To Petitioner: the dining set, the piano...
