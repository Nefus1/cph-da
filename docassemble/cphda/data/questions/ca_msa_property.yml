  - Description: other_assets[i].description
    input type: area
    rows: 2
  - Value: other_assets[i].value
    datatype: currency
    min: 0
  - Character: other_assets[i].character
    input type: radio
    choices:
      - Community property: community
      - Mixed (part community, part separate): mixed
      - ${ petitioner }'s separate property: sp_pet
      - ${ respondent }'s separate property: sp_resp
    default: community
  - Net community interest: other_assets[i].community_portion
    datatype: currency
    show if:
      variable: other_assets[i].character
      is: mixed
  - Awarded to: other_assets[i].awarded_to
    input type: radio
    choices:
      - ${ petitioner }: pet
      - ${ respondent }: resp
      - Divided equally in kind: split
    js show if: |
      val("other_assets[i].character") == "community" || val("other_assets[i].character") == "mixed"
---
id: other asset complete
code: |
  other_assets[i].description
  other_assets[i].complete = True
