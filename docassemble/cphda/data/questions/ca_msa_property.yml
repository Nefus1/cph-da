---
comment: |
  Assets, debts, reimbursement claims, and the equal-division
  (equalization) calculation for the California MSA interview.
---
id: equalization numbers
reconsider: True
code: |
  eq = equalization([real_property, vehicles, accounts, retirement_plans, businesses, other_assets], debts)
---
id: property intro note
template: character_help
content: |
  **Characterizing property.**

  * **Community:** acquired during the ${ marriage_word } before the
    date of separation (Fam. Code, § 760), including
    {quasi-community property}. Title does not control.
  * **{separate property|Separate}:** owned before the ${ marriage_word }, received by
    gift or inheritance, or acquired after separation (§ 770).
  * **Mixed:** part community and part separate, e.g., a house bought
    before the ${ marriage_word } and paid down during it
    ({Moore/Marsden}), or an account with premarital funds that
    received contributions during the ${ marriage_word }. Enter the
    **net community interest** as the community portion.
    Award a mixed item to the party who owns the separate interest;
    the agreement confirms that separate interest to the party who
    receives the item.

  The parties may agree to treat property any way they like, but an
  agreement that *changes* the character of property is a
  {transmutation} and must be in writing with an express
  declaration (Fam. Code, § 852). Confirming property as separate in
  this agreement satisfies that requirement.
---
#######################################################################
# Real property
#######################################################################
id: any real property
section: rev_property
question: Do either or both parties own any real estate?
subquestion: |
  Include the family home, rentals, vacant land, timeshares with a
  deeded interest, and property outside California. Include separate
  property too, so it can be confirmed to its owner.
yesno: real_property.there_are_any
help: |
  **Out-of-state real property.** A California court cannot directly
  transfer title to land in another state, but it can order the
  parties to sign deeds. The agreement includes a clause requiring
  both parties to sign any document needed to carry out the
  division.
---
id: real property item
section: rev_property
question: |
  Real estate ${ '#' + str(i + 1) if i else '' }
fields:
  - Property address: real_property[i].description
    input type: area
    rows: 2
    hint: 123 Main Street, Los Angeles, CA 90012
  - Assessor's Parcel Number (APN): real_property[i].apn
    required: False
    grid: 6
    help: |
      Needed for the deed and the legal description. Find it on the
      property tax bill or the county assessor's website.
  - Current title vesting: real_property[i].vesting
    required: False
    grid: 6
    hint: e.g., Husband and wife as community property
  - Fair market value: real_property[i].value
    datatype: currency
    min: 0
    grid: 6
    help: |
      Use an appraisal, a broker's opinion of value, or the agreed
      value. Note the source in the memo. Agreed values are binding
      for the division even if the property later sells for more or
      less.
  - Total loans and liens: real_property[i].encumbrance
    datatype: currency
    min: 0
    grid: 6
    help: |
      First mortgage, HELOC, second deed of trust, tax liens, and
      other liens. The agreement uses value minus liens as the equity.
  - Lender(s): real_property[i].lenders
    required: False
  - Character: real_property[i].character
    input type: radio
    choices:
      - Community property: community
      - Mixed (part community, part separate): mixed
      - ${ petitioner }'s separate property: sp_pet
      - ${ respondent }'s separate property: sp_resp
  - Net community interest: real_property[i].community_portion
    datatype: currency
    show if:
      variable: real_property[i].character
      is: mixed
    help: |
      The community's share of the equity under {Moore/Marsden} (or
      as agreed). The rest of the equity is confirmed as the
      owner's separate property.
  - What happens to the property?: real_property[i].disposition
    input type: radio
    choices:
      - Awarded to ${ petitioner }: pet
      - Awarded to ${ respondent }: resp
      - Sold, with net proceeds divided equally: sell
    js show if: |
      val("real_property[i].character") == "community" || val("real_property[i].character") == "mixed"
help: |
  ${ character_help }

  **Buyouts.** When one party keeps the house, the equity goes into
  the equalization calculation, and the party keeping it usually
  must refinance the loan out of the other party's name. Until then,
  the other party stays liable to the lender; a hold-harmless clause
  protects only between the parties.
---
id: real property award terms
section: rev_property
question: |
  Terms for ${ real_property[i].description.splitlines()[0] }
if: real_property[i].disposition in ('pet', 'resp')
fields:
  - Days to refinance or assume the loans and remove ${ party_obj['resp' if real_property[i].disposition == 'pet' else 'pet'].ref }'s name: real_property[i].refinance_days
    datatype: integer
    min: 0
    default: 180
    help: |
      Enter 0 if there are no loans. If the refinance does not
      happen in time, the standard clause requires the property to
      be listed for sale.
  - If the refinance does not happen in time: real_property[i].refi_fallback
    input type: radio
    choices:
      - The property must be listed for sale: sell
      - The other party may seek relief from the court: court
    default: sell
  - Days for the other party to sign an interspousal transfer deed: real_property[i].deed_days
    datatype: integer
    min: 1
    default: 30
    help: |
      An Interspousal Transfer Grant Deed is exempt from documentary
      transfer tax and does not trigger property tax reassessment
      (Rev. & Tax. Code, § 63). Have the deed signed into escrow at
      the refinance, or recorded on signing if there are no loans.
---
id: real property sale terms
section: rev_property
question: |
  Sale terms for ${ real_property[i].description.splitlines()[0] }
if: real_property[i].disposition == 'sell'
fields:
  - List the property for sale within (days): real_property[i].list_days
    datatype: integer
    min: 0
    default: 60
  - Listing agent: real_property[i].agent
    input type: radio
    choices:
      - Chosen jointly: joint
      - Chosen by ${ petitioner }: pet
      - Chosen by ${ respondent }: resp
    default: joint
  - Who lives in the property until the sale?: real_property[i].occupant
    input type: radio
    choices:
      - ${ petitioner }: pet
      - ${ respondent }: resp
      - Neither (vacant or rented): none
  - Who pays the mortgage, taxes, and insurance until the sale?: real_property[i].carrying_costs
    input type: radio
    choices:
      - The party living there, with no reimbursement: occupant
      - Shared equally: equal
      - The party living there, reimbursed from the sale proceeds: reimbursed
  - Price reductions: real_property[i].price_terms
    input type: area
    required: False
    hint: e.g., The parties will follow the listing agent's recommendation on list price and reductions.
help: |
  If the parties cannot agree on an offer, the agreement allows
  either party to ask the court to resolve the dispute, and the court
  keeps jurisdiction to order the sale (Fam. Code, § 2550; Code Civ.
  Proc., § 664.6 if the agreement is enforced as a settlement).
---
id: real property complete
code: |
  real_property[i].description
  if not real_property[i].is_separate():
    if real_property[i].disposition == 'sell':
      real_property[i].list_days
    else:
      real_property[i].refinance_days
  real_property[i].complete = True
---
id: another real property
section: rev_property
question: Is there any other real estate?
subquestion: |
  So far: ${ comma_and_list([p.description.splitlines()[0] for p in real_property.complete_elements()]) }.
yesno: real_property.there_is_another
---
#######################################################################
# Vehicles
#######################################################################
