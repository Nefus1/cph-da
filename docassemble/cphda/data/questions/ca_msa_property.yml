#######################################################################
# Debts
#######################################################################
id: any debts
section: rev_property
question: Do either or both parties have debts?
subquestion: |
  Credit cards, personal and student loans, medical debt, tax debt,
  vehicle leases, and loans from family. Mortgages and car loans
  entered earlier are already counted.
yesno: debts.there_are_any
help: |
  **Debts after separation.** Debts incurred after the date of
  separation for non-necessaries are confirmed to the party who
  incurred them without offset (Fam. Code, § 2623(b)).

  **Student loans.** Educational loans are generally assigned to the
  party who received the education (Fam. Code, § 2627).

  **Creditors are not bound.** A creditor can still collect a joint
  debt from either party. The agreement's {hold harmless} clause gives
  the paying party a right to reimbursement from the other.
---
