---
comment: |
  Glossary for the California MSA interview. Write a term in curly
  braces in any question text, e.g. {community property}, to show
  its definition in a popover.
---
terms:
  - community property: |
      Property acquired by either spouse during the marriage while
      domiciled in California, other than by gift or inheritance
      (Fam. Code, § 760). Divided equally on dissolution unless the
      parties agree otherwise in writing (§ 2550).
  - separate property: |
      Property owned before marriage, acquired by gift or
      inheritance, or acquired after the date of separation, plus
      the rents and profits of that property (Fam. Code, §§ 770,
      771).
  - quasi-community property: |
      Property acquired while living outside California that would
      have been community property if acquired here (Fam. Code,
      § 125). Treated as community property on dissolution.
  - date of separation: |
      The date a complete and final break in the marriage occurred,
      shown by one spouse's expressed intent to end it and conduct
      consistent with that intent (Fam. Code, § 70).
  - long duration: |
      A marriage of 10 years or more, from marriage to separation.
      The court keeps jurisdiction over spousal support indefinitely
      unless the parties agree otherwise in writing (Fam. Code,
      § 4336).
  - In re Marriage of Brown: |
      (1976) 15 Cal.3d 838. Pension rights earned during marriage
      are community property even if not yet vested. The community
      share is usually found with the "time rule": months of
      service during marriage divided by total months of service.
  - equalizing payment: |
      A cash payment from the party who receives more of the net
      community estate to the other party, so each ends up with an
      equal share (Fam. Code, § 2550).
  - QDRO: |
      Qualified Domestic Relations Order. A court order that tells
      an employer retirement plan to pay part of a participant's
      benefit to the former spouse. Needed for 401(k), 403(b), and
      pension plans; public plans (CalPERS, CalSTRS, federal, and
      military) use their own order formats. IRAs do not need one.
  - Epstein credits: |
      Reimbursement to a spouse who used separate property after
      separation to pay a community debt, such as the mortgage
      (In re Marriage of Epstein (1979) 24 Cal.3d 76).
  - Watts charges: |
      A charge against a spouse who had exclusive use of a community
      asset, such as the family home, after separation, measured by
      its fair rental value (In re Marriage of Watts (1985) 171
      Cal.App.3d 366).
  - Section 2640 reimbursement: |
      Reimbursement for separate-property contributions (down
      payments, principal reduction, improvements) traced to the
      acquisition of community property, without interest
      (Fam. Code, § 2640). Can be waived in writing.
  - Moore/Marsden: |
      The formula for apportioning a home bought before marriage
      and paid down with community funds (In re Marriage of Moore
      (1980) 28 Cal.3d 366; In re Marriage of Marsden (1982) 130
      Cal.App.3d 426).
  - transmutation: |
      An agreement changing the character of property (for example,
      separate to community). Valid only if made in writing with an
      express declaration by the adversely affected spouse
      (Fam. Code, § 852).
  - Declaration of Disclosure: |
      The sworn disclosure of assets, debts, and income each party
      must serve (FL-140, with FL-142 or FL-160 and FL-150). The
      preliminary declaration is mandatory (Fam. Code, § 2104); the
      final declaration can be waived in writing (§ 2105(d)).
  - guideline support: |
      Child support calculated with the statewide formula in
      Fam. Code, § 4055, usually with DissoMaster, XSpouse, or the
      state calculator. The amount is presumed correct.
  - timeshare: |
      The percentage of time each parent has primary physical
      responsibility for the children. A key input to guideline
      child support.
  - legal custody: |
      The right and responsibility to make decisions about a child's
      health, education, and welfare (Fam. Code, §§ 3003, 3006).
  - physical custody: |
      Where the child lives and who supervises the child
      (Fam. Code, §§ 3004, 3007).
  - Gavron warning: |
      Notice that each party must make reasonable efforts to become
      self-supporting (Fam. Code, § 4330(b); In re Marriage of
      Gavron (1988) 203 Cal.App.3d 705).
  - Richmond order: |
      A spousal support order that ends on a set date unless the
      supported party files a motion to extend it before that date
      (In re Marriage of Richmond (1980) 105 Cal.App.3d 352).
  - hold harmless: |
      A promise to pay a debt and to protect the other party from
      any claim, cost, or attorney's fees caused by that debt.
