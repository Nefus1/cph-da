{
  "doc_type": "three_day_notice",
  "version": "v1",
  "template_file": "template.docx",
  "jurisdiction": {
    "base_pack": "ca_base",
    "packs": [
      {
        "id": "ca_base",
        "disclosures": ["California Civil Code disclosure language."],
        "validations": [
          {
            "id": "amount_positive",
            "expression": "amount_due > 0",
            "message": "Amount due must be greater than zero."
          }
        ]
      },
      {
        "id": "la_local",
        "include_when": "county == \"Los Angeles\"",
        "questions": [
          {
            "id": "has_rso_property",
            "prompt": "Is the property subject to the RSO?",
            "type": "boolean",
            "visible_when": "state == \"CA\""
          }
        ],
        "clauses": [
          {
            "id": "la_rso_language",
            "title": "Los Angeles RSO Language",
            "text": "Additional language for RSO-protected properties is included.",
            "default_included": false,
            "include_when": "has_rso_property == True"
          }
        ],
        "disclosures": ["Los Angeles local disclosure."]
      },
      {
        "id": "sf_local",
        "include_when": "county == \"San Francisco\"",
        "questions": [
          {
            "id": "sf_rent_board_registration",
            "prompt": "Enter SF Rent Board registration number.",
            "type": "string",
            "visible_when": "county == \"San Francisco\""
          }
        ],
        "disclosures": ["San Francisco Rent Ordinance disclosure."]
      }
    ]
  }
}
