{
  "clauses": [
    {
      "id": "division_of_property",
      "title": "Division of Property",
      "text": "The parties agree to divide community and separate property as stated in the schedules.",
      "default_included": true
    },
    {
      "id": "allocation_of_debts",
      "title": "Allocation of Debts",
      "text": "The parties agree to allocate debts and hold each other harmless as specified.",
      "default_included": true
    },
    {
      "id": "spousal_support",
      "title": "Spousal Support",
      "text": "Spousal support terms are set forth and are enforceable by the court.",
      "default_included": true
    },
    {
      "id": "child_custody_parenting_plan",
      "title": "Child Custody and Parenting Plan",
      "text": "Custody and parenting schedule are set according to the parties' parenting plan.",
      "include_when": "with_minor_children == True"
    },
    {
      "id": "child_support",
      "title": "Child Support",
      "text": "Child support is ordered consistent with California guideline principles.",
      "include_when": "with_minor_children == True"
    },
    {
      "id": "no_minor_children_statement",
      "title": "No Minor Children Statement",
      "text": "The parties affirm there are no minor children of this relationship.",
      "include_when": "with_minor_children == False"
    },
    {
      "id": "schedule_assets_clause",
      "title": "Schedule A - Assets",
      "text": "Assets listed in Schedule A are incorporated by reference.",
      "default_included": true
    },
    {
      "id": "schedule_debts_clause",
      "title": "Schedule B - Debts",
      "text": "Debts listed in Schedule B are incorporated by reference.",
      "default_included": true
    },
    {
      "id": "schedule_accounts_clause",
      "title": "Schedule C - Accounts",
      "text": "Accounts listed in Schedule C are incorporated by reference.",
      "default_included": true
    },
    {
      "id": "schedule_vehicles_clause",
      "title": "Schedule D - Vehicles",
      "text": "Vehicles listed in Schedule D are incorporated by reference.",
      "default_included": true
    },
    {
      "id": "schedule_real_property_clause",
      "title": "Schedule E - Real Property",
      "text": "Real property listed in Schedule E is incorporated by reference.",
      "default_included": true
    }
  ]
}
