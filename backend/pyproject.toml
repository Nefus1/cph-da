[project]
name = "contract-platform-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2.1",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "python-multipart>=0.0.9",
  "alembic>=1.13.1",
  "email-validator>=2.2.0",
  "docxtpl>=0.18.0"
]

[tool.uv]
dev-dependencies = ["pytest>=8.2.0", "httpx>=0.27.0"]
